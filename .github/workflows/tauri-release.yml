name: Tauri Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "构建范围"
        required: false
        default: all
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows-x64
          - linux-x64
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.1"
  # Lite 前端构建开关：tauri.conf 的 beforeBuildCommand 不再内联环境变量
  # （Windows 的 cmd 不支持 `VAR=val cmd` 语法），统一由这里注入。
  VITE_LITE: "1"
  # tauri build 会再跑一次 beforeBuildCommand（vite build），同样需要更大的堆，
  # 否则 macOS 上会 heap OOM。
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          ALL='[
            {"os":"macos-14","target":"aarch64-apple-darwin","node_dist":"darwin-arm64","npm_arch":"arm64","artifact":"macos-arm64","platform":"macos","bundles":""},
            {"os":"macos-14","target":"x86_64-apple-darwin","node_dist":"darwin-x64","npm_arch":"x64","artifact":"macos-x64","platform":"macos","bundles":""},
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","node_dist":"win-x64","npm_arch":"x64","artifact":"windows-x64","platform":"windows","bundles":""},
            {"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","node_dist":"linux-x64","npm_arch":"x64","artifact":"linux-x64","platform":"linux","bundles":"deb"}
          ]'
          T="${{ github.event.inputs.target }}"
          if [ -z "$T" ] || [ "$T" = "all" ]; then
            echo "matrix={\"include\":$ALL}" >> "$GITHUB_OUTPUT"
          else
            FILTERED=$(echo "$ALL" | jq -c --arg t "$T" '{include: [.[] | select(.artifact == $t)]}')
            echo "matrix=$FILTERED" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.artifact }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf libssl-dev libfuse2 file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      # 后端产物（tsc 输出 + 运行时 externals）。npm_config_arch 保证 macOS x64
      # 交叉构建时 better-sqlite3 / sqlite-vec 拉取 x64 预编译包。
      - name: Build backend
        shell: bash
        env:
          npm_config_arch: ${{ matrix.npm_arch }}
        run: |
          cd backend
          npm ci --no-audit --no-fund
          npx tsc
          cp src/plugins/runner-child.mjs src/plugins/sandbox-child.mjs dist/plugins/
          npm prune --omit=dev

      - name: Build frontend (Lite)
        shell: bash
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build:web

      - name: Install Tauri CLI
        shell: bash
        run: |
          cd tauri
          npm ci --no-audit --no-fund

      - name: Prepare Node sidecar (unix)
        if: matrix.platform != 'windows'
        run: |
          cd tauri
          mkdir -p src-tauri/binaries
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-${{ matrix.node_dist }}.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /tmp
          cp "/tmp/node-v${NODE_VERSION}-${{ matrix.node_dist }}/bin/node" "src-tauri/binaries/node-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/node-${{ matrix.target }}"

      - name: Prepare Node sidecar (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd tauri
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-${{ matrix.node_dist }}.zip" -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath .
          Copy-Item "node-v$env:NODE_VERSION-${{ matrix.node_dist }}\node.exe" "src-tauri/binaries/node-${{ matrix.target }}.exe"

      - name: Build bundles
        shell: bash
        working-directory: tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          if [ -n "${{ matrix.bundles }}" ]; then
            npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            npx tauri build --target ${{ matrix.target }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nowen-note-lite-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.AppImage
