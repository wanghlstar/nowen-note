name: Tauri Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "构建范围"
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - windows-x64
          - linux-x64
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.1"
  # Lite 前端构建开关：tauri.conf 的 beforeBuildCommand 不再内联环境变量
  # （Windows 的 cmd 不支持 `VAR=val cmd` 语法），统一由这里注入。
  VITE_LITE: "1"
  # tauri build 会再跑一次 beforeBuildCommand（vite build），同样需要更大的堆，
  # 否则 macOS 上会 heap OOM。
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          ALL='[
            {"os":"macos-14","targets":"aarch64-apple-darwin x86_64-apple-darwin","node_dists":"darwin-arm64 darwin-x64","npm_archs":"arm64 x64","artifact":"macos","platform":"macos","bundles":""},
            {"os":"windows-latest","targets":"x86_64-pc-windows-msvc","node_dists":"win-x64","npm_archs":"x64","artifact":"windows-x64","platform":"windows","bundles":""},
            {"os":"ubuntu-22.04","targets":"x86_64-unknown-linux-gnu","node_dists":"linux-x64","npm_archs":"x64","artifact":"linux-x64","platform":"linux","bundles":"deb"}
          ]'
          T="${{ github.event.inputs.target }}"
          if [ -z "$T" ] || [ "$T" = "all" ]; then
            echo "matrix=$(echo "$ALL" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          else
            FILTERED=$(echo "$ALL" | jq -c --arg t "$T" '{include: [.[] | select(.artifact == $t)]}')
            echo "matrix=$FILTERED" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.artifact }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf libssl-dev libfuse2 file

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do rustup target add "$t"; done

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Build frontend (Lite)
        shell: bash
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build:web

      - name: Install Tauri CLI
        shell: bash
        run: |
          cd tauri
          npm ci --no-audit --no-fund

      # 每个目标：按目标架构准备后端依赖（原生模块）+ Node sidecar，再打包。
      # macOS 两个架构在同一 runner 顺序执行，避免第二个 macOS job 排队超时被取消。
      - name: Build bundles (per target)
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TARGETS: ${{ matrix.targets }}
          NODE_DISTS: ${{ matrix.node_dists }}
          NPM_ARCHS: ${{ matrix.npm_archs }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          read -r -a T <<< "$TARGETS"
          read -r -a D <<< "$NODE_DISTS"
          read -r -a A <<< "$NPM_ARCHS"
          for i in "${!T[@]}"; do
            target="${T[$i]}"; dist="${D[$i]}"; arch="${A[$i]}"
            echo "==> building $target (node $dist, npm arch $arch)"
            (
              cd backend
              rm -rf node_modules
              npm_config_arch="$arch" npm ci --no-audit --no-fund
              npx tsc
              cp src/plugins/runner-child.mjs src/plugins/sandbox-child.mjs dist/plugins/
              npm prune --omit=dev
            )
            mkdir -p tauri/src-tauri/binaries
            if [ "${{ matrix.platform }}" = "windows" ]; then
              curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-${dist}.zip" -o /tmp/node.zip
              rm -rf /tmp/node-dist && mkdir -p /tmp/node-dist
              unzip -q /tmp/node.zip -d /tmp/node-dist || powershell -NoProfile -Command "Expand-Archive -Path /tmp/node.zip -DestinationPath /tmp/node-dist -Force"
              cp "/tmp/node-dist/node-v${NODE_VERSION}-${dist}/node.exe" "tauri/src-tauri/binaries/node-${target}.exe"
            else
              curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-${dist}.tar.xz" -o /tmp/node.tar.xz
              rm -rf /tmp/node-dist && mkdir -p /tmp/node-dist
              tar -xJf /tmp/node.tar.xz -C /tmp/node-dist
              cp "/tmp/node-dist/node-v${NODE_VERSION}-${dist}/bin/node" "tauri/src-tauri/binaries/node-${target}"
              chmod +x "tauri/src-tauri/binaries/node-${target}"
            fi
            if [ -n "$BUNDLES" ]; then
              (cd tauri && npx tauri build --target "$target" --bundles "$BUNDLES")
            else
              (cd tauri && npx tauri build --target "$target")
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nowen-note-lite-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: |
            tauri/src-tauri/target/**/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/**/release/bundle/macos/*.app
            tauri/src-tauri/target/**/release/bundle/msi/*.msi
            tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            tauri/src-tauri/target/**/release/bundle/deb/*.deb
            tauri/src-tauri/target/**/release/bundle/appimage/*.AppImage

  release:
    name: Publish GitHub Release
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.AppImage
