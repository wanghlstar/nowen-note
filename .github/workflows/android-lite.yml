name: Android Lite

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  VITE_LITE: "1"

jobs:
  build-apk:
    name: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # setup-android@v3 在新 runner 上会因 'tools' 包不存在而失败，直接用预装 SDK。
      - name: Prepare Android SDK
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -n "$SDKM" ] || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build frontend (Lite)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Assemble debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/nowen-note-lite-android-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nowen-note-lite-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Attach APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nowen-note-lite-android
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/*.apk
